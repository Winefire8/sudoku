name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is pre-installed on the ubuntu-latest image; the
      # setup-android action re-downloads it and was the step that failed.
      - name: Locate the pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest > /tmp/gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tr -d '\r' < /tmp/gradle.log > /tmp/g.log
            echo "::error::=== marker: failing tests ==="
            grep -nE "^e: |FAILED|failed|AssertionError|expected:|What went wrong" /tmp/g.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            echo "::error::=== marker: xml reports ==="
            find app/build/test-results -name "*.xml" 2>/dev/null | head -5 | while IFS= read -r f; do
              grep -oE '<testcase name="[^"]*"|<failure[^>]*message="[^"]{0,300}"' "$f" | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            done
            exit $code
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Inspect APK
        run: |
          ls -la app/build/outputs/apk/debug/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/*.apk | head -6

      - name: Publish APK as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="apk-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" --title "Debug APK $TAG" \
            --notes "Automatically built debug APK (commit $GITHUB_SHA)."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-assist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
