name: Build APK

# Builds an installable debug APK on every push and attaches it to the run.
# Also publishes the APK as a release asset when a tag is pushed.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is pre-installed on the ubuntu-latest image. The
      # android-actions/setup-android action re-downloads it and was the step that
      # failed in this environment, so the pre-installed SDK is used as-is.
      - name: Locate the pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Inspect APK
        run: |
          ls -la app/build/outputs/apk/debug/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/*.apk | head -6

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-assist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/*.apk \
            --repo "$GITHUB_REPOSITORY" --title "Sudoku Assist ${GITHUB_REF_NAME}" \
            --notes "Debug APK built from ${GITHUB_SHA}." || \
          gh release upload "${GITHUB_REF_NAME}" app/build/outputs/apk/debug/*.apk --clobber
