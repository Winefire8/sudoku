name: Build APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is pre-installed on the ubuntu-latest image; the
      # setup-android action re-downloads it and was the failing step.
      - name: Locate the pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest > /tmp/gradle.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            tr -d '\r' < /tmp/gradle.log > /tmp/g.log
            echo "::error::=== marker: failing tests ==="
            grep -nE "^e: |FAILED|AssertionError|What went wrong" /tmp/g.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit $code
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Inspect APK
        run: |
          ls -la app/build/outputs/apk/debug/
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging app/build/outputs/apk/debug/*.apk | head -6

      # The APK is 180 MB; it is split into 20 MB parts and committed to this branch so
      # that it can be retrieved through the git protocol alone.
      - name: Commit the APK to the branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          mkdir -p apk-parts
          rm -f apk-parts/*
          split -b 20M -d -a 3 "$APK" apk-parts/app-debug.apk.part.
          ( cd apk-parts && sha256sum app-debug.apk.part.* > SHA256SUMS )
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f apk-parts
          git commit -m "APK build $GITHUB_RUN_NUMBER: ${GITHUB_SHA:0:7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-assist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
